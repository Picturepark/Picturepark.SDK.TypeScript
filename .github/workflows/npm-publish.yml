name: NPM packages publish

on:
  push:
    branches:
      - release
  workflow_dispatch:
    

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  npm-publish:
    runs-on: [ubuntu-latest]
    env:
      # Manual runs default to prerelease publishing; release pushes use latest.
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' }}
      NPM_TAG: ${{ github.event_name == 'workflow_dispatch' && 'pre' || 'latest' }}
      REPOSITORY_URL: git+https://github.com/${{ github.repository }}.git
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Prepare package metadata and versions
        shell: bash
        run: |
          packages=(
            src/picturepark-sdk-v1-fetch
            src/picturepark-sdk-v1-pickers
            src/picturepark-sdk-v2-angular/projects/picturepark-sdk-v2-angular
            src/picturepark-sdk-v2-angular/projects/picturepark-sdk-v2-angular-oidc
          )
          for package in "${packages[@]}"; do
            (cd "$package" && npm pkg set repository.type=git repository.url="$REPOSITORY_URL" repository.directory="$package")
            if [[ "$PRERELEASE" == "true" ]]; then
              # Run and attempt numbers also make retries of the same commit unique.
              (cd "$package" && npm version prerelease --preid="pre-${GITHUB_SHA::7}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version)
            else
              version=$(node -p "require('./$package/package.json').version")
              if [[ "$version" == *-* ]]; then
                echo "::error::Cannot publish $package@$version under latest. Set a stable version or run manually with prerelease enabled."
                exit 1
              fi
            fi
          done

      - name: Build
        run: |
          npm install
          npm run build:fetch
          npm run build:pickers

      - name: Build Angular V2 libraries
        working-directory: ./src/picturepark-sdk-v2-angular
        run: |
          npm run init
          npm run lint
          npm run build-libraries

      # Keep the build on Node 20; trusted publishing requires Node >=22.14.0
      # and npm >=11.5.1, which are provided by the latest Node 24 release.
      - name: Use Node.js 24 for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          scope: '@picturepark'

      - name: Publish fetch packages
        working-directory: ./src/picturepark-sdk-v1-fetch/
        run: npm publish --access=public --tag "$NPM_TAG"

      - name: Publish pickers packages
        working-directory: ./src/picturepark-sdk-v1-pickers/
        run: npm publish --access=public --tag "$NPM_TAG"

      - name: Publish angular packages
        working-directory: ./src/picturepark-sdk-v2-angular/dist/picturepark-sdk-v2-angular/
        run: npm publish --access=public --tag "$NPM_TAG"

      - name: Publish angular oidc packages
        working-directory: ./src/picturepark-sdk-v2-angular/dist/picturepark-sdk-v2-angular-oidc/
        run: npm publish --access=public --tag "$NPM_TAG"
